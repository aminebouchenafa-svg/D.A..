<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FLOW — Fitness · Layover · Operations · Wellness</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Conteneur d'app : rempli par js/app.js -->
  <div id="app" aria-live="polite"></div>

  <!-- Barre de navigation basse -->
  <nav id="tabbar" class="tabbar" hidden>
    <button class="tab" data-view="today">
      <span class="tab__icon">📅</span><span class="tab__label">Aujourd’hui</span>
    </button>
    <button class="tab" data-view="calendar">
      <span class="tab__icon">🗓️</span><span class="tab__label">Calendrier</span>
    </button>
    <button class="tab" data-view="roster">
      <span class="tab__icon">✈️</span><span class="tab__label">Roster</span>
    </button>
    <button class="tab" data-view="programs">
      <span class="tab__icon">🏆</span><span class="tab__label">Défis</span>
    </button>
    <button class="tab" data-view="progress">
      <span class="tab__icon">📈</span><span class="tab__label">Progrès</span>
    </button>
    <button class="tab" data-view="settings">
      <span class="tab__icon">⚙️</span><span class="tab__label">Réglages</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
